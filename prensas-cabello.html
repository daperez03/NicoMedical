<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/styles.css">

    <link rel="apple-touch-icon" href="img/logo.png">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <img src="img/logo.png" alt="NicoMedical"> NicoMedical

      <nav class="nav">
        <a href="index.html">Inicio</a>

    <section class="detail" data-inventory-product="prensas-cabello">

        <img id="product-image" src="img/Presas_de_cabello_1.jpeg" alt="Set de prensas de cabello">
